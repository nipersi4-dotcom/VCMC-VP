<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#07111f">
<meta name="description" content="VCMC-VP — Universal Global Development Architecture and operational partner gateway.">
<title>VCMC-VP — Universal Global Development Architecture</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--navy:#07111f;--panel:#0b1728;--panel2:#101f35;--line:#26354a;--text:#f6f7fb;--muted:#a8b2c3;--gold:#c9a45c;--gold2:#e4c987;--teal:#5bc0be;--danger:#e7a3a3;--good:#a7d6b1;--shadow:0 18px 42px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#14243b 0,var(--navy) 40%,#03070d 100%);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}a{color:var(--gold2)}.wrap{max-width:1160px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--gold2),#8e6d2e);color:#111827;font-weight:950;font-size:23px;box-shadow:0 8px 24px #0005}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:800}h1,h2,h3,p{margin:0}h1{font-size:24px;line-height:1.2}.subtitle,.muted,small{color:var(--muted)}.subtitle{font-size:13px;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #c9a45c55;border-radius:999px;color:var(--gold2);font-size:11px;font-weight:750;background:#c9a45c12}.pill.teal{color:#8dd8d5;border-color:#5bc0be55;background:#5bc0be0d}.pill.warn{color:#f0ce85}.card{background:linear-gradient(145deg,#101f35f5,#081323f5);border:1px solid var(--line);border-radius:19px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.hero{padding:24px;background:linear-gradient(120deg,#c9a45c12,#0b1728 55%,#101f35)}.hero h2{font-size:clamp(23px,4vw,34px);margin:8px 0}.hero p{max-width:780px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 2px 10px}.sectionhead h2,.sectionhead h3{font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.room,.feeditem{border:1px solid var(--line);border-radius:14px;background:#ffffff05;padding:14px}.tile b,.room b{display:block;margin-bottom:4px}.tile-action{text-align:left;color:var(--text);width:100%;cursor:pointer;transition:border-color .15s,transform .15s}.tile-action:hover{border-color:#c9a45c99;transform:translateY(-1px)}.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.room{text-align:left;color:var(--text);min-height:125px;transition:border-color .15s,transform .15s;background:linear-gradient(145deg,#101f35aa,#07111faa)}.room:hover{border-color:#c9a45c99;transform:translateY(-1px)}.room .desc{display:block;color:var(--muted);font-size:13px;margin:4px 0 12px}.status{font-size:11px;letter-spacing:.03em;color:var(--gold2)}.feed{display:grid;gap:9px}.feeditem{border-left:3px solid var(--gold)}.feeditem.warn{border-left-color:#e3ba67}.feeditem.good{border-left-color:var(--good)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{border:1px solid #46536a;background:#ffffff08;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:700}.btn:hover{border-color:var(--gold)}.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#101827;border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{display:flex;flex-direction:column;gap:5px;margin:6px 0}.field label{font-size:12px;color:var(--muted)}.input{width:100%;border:1px solid #34435b;background:#050c17;color:var(--text);border-radius:10px;padding:11px 12px;min-width:0}.input:focus{border-color:var(--gold)}textarea.input{min-height:90px;resize:vertical}.full{grid-column:1/-1}.hidden{display:none!important}.page{animation:fade .15s ease}@keyframes fade{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #43516a;border-radius:13px}.notice{padding:12px 14px;border-radius:11px;border:1px solid #c9a45c55;background:#c9a45c0b;color:#eadab7;font-size:13px}.goodtext{color:var(--good)}.badtext{color:var(--danger)}.bottomnav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px max(8px,calc((100vw - 1160px)/2));background:#050b14f5;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottomnav button{border:0;background:transparent;color:var(--muted);padding:6px 2px;font-size:11px;border-radius:9px}.bottomnav button.active{color:var(--gold2);background:#c9a45c12}.bottomnav .ico{font-size:18px;line-height:1.2}.small{font-size:12px}.kpi{font-size:22px;font-weight:850;color:var(--gold2)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold2)}.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}.checkline input{margin-top:5px}.right{margin-left:auto}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.rooms{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:1.1fr .9fr}}
@media(max-width:520px){.top{align-items:flex-start}.top>.pill{max-width:100px;text-align:center}.wrap{padding:12px 12px 92px}.card{padding:15px}.hero{padding:19px}.formgrid,.split{grid-template-columns:1fr}.rooms{grid-template-columns:1fr}.room{min-height:unset}.brand .eyebrow{font-size:9px}h1{font-size:21px}.sectionhead{align-items:start}}
</style>

<body>
<main class="wrap">
<header class="top">
 <div class="brand"><div class="mark" aria-hidden="true">V</div><div><div class="eyebrow">Universal Global Development Architecture</div><h1>VCMC-VP</h1><div class="subtitle">Operational Platform · Public Global Partner Gateway</div></div></div>
 <span class="pill" id="front-status">FRONTEND ACTIVE</span>
</header>
<div id="app" aria-live="polite"></div>
</main>
<nav class="bottomnav" aria-label="Main navigation">
 <button data-tab="home" onclick="go('home')"><div class="ico">⌂</div>Home</button>
 <button data-tab="architecture" onclick="go('architecture')"><div class="ico">◈</div>Architecture</button>
 <button data-tab="rooms" onclick="go('rooms')"><div class="ico">▦</div>Rooms</button>
 <button data-tab="evidence" onclick="go('evidence')"><div class="ico">✓</div>Evidence</button>
 <button data-tab="system" onclick="go('system')"><div class="ico">⚙</div>System</button>
</nav>
<script>
'use strict';
const API_KEY='vcmc_api_base';
const TOKEN_KEY='vcmc_session_token';
const rooms=[
{id:'architecture',name:'Architecture',desc:'Identity, foundation & governance',state:'available',purpose:'TAQDA → VCMC → Real Development → Real Benefit → Global Scale',route:'Read-only architecture and governance boundary.'},
{id:'network',name:'Global Network',desc:'Global / cross-border interaction',state:'next stage',purpose:'Identify → Screen → Classify → Route → Authorize → Interact → Evidence → Reconcile',api:'/api/network'},
{id:'partners',name:'Partners & Candidates',desc:'Screening, classification & registry',state:'next stage',purpose:'Candidate ≠ Partner. Registration does not grant authority.',api:'/api/partners'},
{id:'pilots',name:'Pilots',desc:'Pilot lifecycle & proof window',state:'next stage',purpose:'Candidate ≠ Pilot. A pilot requires a real host, need, capability, KPI and evidence.',api:'/api/pilots'},
{id:'projects',name:'Programs & Projects',desc:'Real development execution layer',state:'next stage',purpose:'Need → direction → program → project → real result.',api:'/api/projects'},
{id:'development',name:'Development Direction',desc:'Need → direction → result',state:'next stage',purpose:'Record a direction; authorization and real-world outcome remain separate.',api:'/api/directions'},
{id:'capital',name:'Capital & Development',desc:'Capital boundary & development',state:'next stage',purpose:'VCMC does not hold funds. A plan is not an investment or proof of funds.',api:'/api/capital-plans'},
{id:'distribution',name:'Distribution',desc:'2.5% Zakat → 40/40/20',state:'functional boundary',purpose:'Gross → 2.5% Zakat first → 97.5% remainder: 40% Mitra, 40% Pusat, 20% Amal & Kemanusiaan.'},
{id:'evidence',name:'Evidence & Verification',desc:'Proof, hash, source & verification',state:'functional boundary',purpose:'CLAIM → RECORDED → EVIDENCE SUBMITTED → VERIFIED → RECONCILED → PROVEN',api:'/api/evidence'},
{id:'reconciliation',name:'Reconciliation',desc:'Expected → executed → received → ledger',state:'functional boundary',purpose:'Reconcile all four amounts. A match is recorded reconciliation, not automatically proof.',api:'/api/reconciliation'},
{id:'security',name:'Security',desc:'Identity, permission & security boundary',state:'functional boundary',purpose:'Identity → Role → Status → Authority → Permission → Access.'},
{id:'system',name:'System & Operations',desc:'Readiness, metrics & controls',state:'functional boundary',purpose:'Check runtime, API, database and real-money gate separately.',api:'/api/system/readiness'},
{id:'payment',name:'Payment / Providers',desc:'Instruction layer; no real-money execution',state:'simulation',purpose:'Payment instruction only. PJP execution and real-money operation remain disabled.'}
];
let page='home',token=sessionStorage.getItem(TOKEN_KEY)||'',identity=null,apiBase=localStorage.getItem(API_KEY)||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0))}
function setMessage(id,msg,good=false){const el=document.getElementById(id);if(el){el.textContent=msg;el.className=good?'goodtext small':'badtext small'}}
function nav(){document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page))}
function go(p){page=p;nav();({home:home,architecture:architecture,rooms:roomsPage,evidence:evidencePage,system:systemPage,access:accessPage,account:accountPage,help:helpPage,login:loginPage}[p]||home)()}
function frame(eyebrow,title,desc,body){document.getElementById('app').innerHTML='<section class="page"><section class="card hero"><div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2><p class="muted">'+desc+'</p></section>'+body+'</section>'}
function roomCards(){return '<div class="rooms">'+rooms.map(r=>'<button class="room" onclick="openRoom(\''+r.id+'\')"><b>'+esc(r.name)+'</b><span class="desc">'+esc(r.desc)+'</span><span class="pill '+(r.state==='simulation'?'warn':'')+'">'+esc(r.state)+'</span></button>').join('')+'</div>'}
function home(){
 const auth=identity?'<span class="pill teal">SESSION ACTIVE · '+esc(identity.role||'IDENTIFIED')+'</span>':'<span class="pill">PUBLIC ACCESS</span>';
 frame('VCMC-VP · OPERATIONAL LOBBY','Satu platform, banyak ruang kerja.','Pintu umum terbuka. Email bukan satu metode identifikasi. Akses, status, otoritas dan izin tetap terpisah.',
 '<section class="card"><div class="actions">'+auth+'<button class="btn primary" onclick="go(\''+(identity?'account':'login')+'\')">'+(identity?'Account & Session':'Login / Identify')+'</button><button class="btn" onclick="go(\'access\')">Request / Invitation</button></div><div class="notice" style="margin-top:14px">TAQDA → VCMC → Real Development → Real Benefit → Global Scale. AI adalah support layer, bukan authority. Real money tetap OFF.</div></section>'+
 '<div class="grid"><button class="tile tile-action" onclick="go(\''+(identity?'account':'login')+'\')"><b>Identity</b><span class="muted">Identity → Role → Authority → Permission</span><span class="status">Buka identifikasi →</span></button><button class="tile tile-action" onclick="go(\'architecture\')"><b>Governance</b><span class="muted">Separation of authority</span><span class="status">Buka Architecture →</span></button><button class="tile tile-action" onclick="go(\'evidence\')"><b>Evidence</b><span class="muted">CLAIM ≠ EVIDENCE</span><span class="status">Buka Evidence →</span></button><button class="tile tile-action" onclick="openRoom(\'reconciliation\')"><b>Reconciliation</b><span class="muted">RECORDED ≠ DONE ≠ PROVEN</span><span class="status">Buka Room →</span></button></div>'+
 '<div class="sectionhead"><h3>Operational Rooms</h3><span class="muted small">13 ruang</span></div>'+roomCards()+
 '<div class="sectionhead"><h3>Control Boundary</h3><span class="muted small">REAL MONEY OFF</span></div><div class="feed"><div class="feeditem warn"><b>Payment / Providers</b><br><span class="muted">Instruction / simulation only. This frontend never executes a real payment.</span></div><div class="feeditem"><b>Proof rule</b><br><span class="muted">READY ≠ PROVEN · UNKNOWN ≠ FAILED · Candidate ≠ Pilot.</span></div></div>');
}
const architectureLayers=[
{id:'taqda',name:'TAQDA',subtitle:'Fondasi Tauhid Al-Qur’an Digital Architecture',body:'TAQDA adalah fondasi nilai dan arah. Kejujuran Mutlak menjadi dasar; AI tetap support, bukan authority. Prinsip dan Master VCMC tidak diubah oleh antarmuka.',items:['Tauhid Al-Qur’an Digital Architecture','Visi: Keadilan Semesta berlandaskan Tauhid Al-Qur’an Digital','Kejujuran Mutlak sebagai fondasi'],next:'vcmc'},
{id:'vcmc',name:'VCMC',subtitle:'Governance, separation of authority, evidence and reconciliation',body:'VCMC adalah arsitektur tata kelola dan rekonsiliasi. VCMC bukan bank, PJP, pemegang dana, pelaksana pembayaran, investor, atau perantara dana.',items:['Pemisahan kewenangan dan akses','Distribusi sesuai ketetapan Master VCMC','Bukti, transparansi, audit trail dan rekonsiliasi'],prev:'taqda',next:'development'},
{id:'development',name:'Real Development',subtitle:'Need → direction → program → project',body:'Pengembangan nyata dimulai dari kebutuhan yang dapat dijelaskan, pihak terkait, kemampuan pelaksana, rencana, indikator, serta batas tanggung jawab. Kandidat tidak otomatis menjadi mitra atau pilot.',items:['Need and context','Development direction','Programs, projects and pilot criteria'],prev:'vcmc',next:'benefit'},
{id:'benefit',name:'Real Benefit',subtitle:'Result, evidence and verification',body:'Manfaat harus dapat ditunjukkan dengan bukti yang dapat diperiksa. Klaim, catatan, bukti yang diajukan, verifikasi, rekonsiliasi dan pembuktian adalah status yang berbeda.',items:['Expected result vs actual result','Source and evidence integrity','Independent verification and reconciliation'],prev:'development',next:'global'},
{id:'global',name:'Global Scale',subtitle:'Cross-border development and responsible expansion',body:'Perluasan lintas negara dilakukan setelah kebutuhan, kemampuan, kewenangan, bukti dan hasilnya dinilai. Indonesia adalah asal, bukan batas. Skala global bukan klaim bahwa semua wilayah sudah aktif.',items:['Global / cross-border network','Local partners and jurisdictional checks','Scale only after evidence and readiness'],prev:'benefit'}
];
function architecture(){frame('ARCHITECTURE V1','VCMC Architecture','Pilih lapisan untuk membuka isi. Gunakan tombol lapisan berikutnya untuk menjelajahi struktur bertingkat.', '<div class="notice">TAQDA → VCMC → Real Development → Real Benefit → Global Scale. Setiap lapisan menjelaskan ruang lingkup dan batasnya; membuka lapisan bukan berarti status operasionalnya telah terbukti.</div><div class="rooms" style="margin-top:12px">'+architectureLayers.map((x,i)=>'<button class="room" onclick="openLayer(\''+x.id+'\')"><span class="status">LAYER '+String(i+1).padStart(2,'0')+'</span><b>'+esc(x.name)+'</b><span class="desc">'+esc(x.subtitle)+'</span><span class="pill">Buka lapisan →</span></button>').join('')+'</div><section class="card"><h3>Governance boundary</h3><p class="muted" style="margin-top:8px">MENENTUKAN ≠ MENGHITUNG ≠ MEMEGANG DANA ≠ MEMBAYAR ≠ MENERIMA. CLAIM ≠ EVIDENCE. READY ≠ PROVEN. UNKNOWN ≠ FAILED. RECORDED ≠ DONE ≠ PROVEN.</p></section><section class="card"><h3>Ketetapan distribusi</h3><p class="muted" style="margin-top:8px">2.5% Zakat terlebih dahulu. Sisa 97.5% dibagi 40% Mitra/Pelaksana, 40% Pusat VCMC, 20% Amal & Kemanusiaan. Alokasi Pusat: 40% IP/Hak Cipta, 40% Dana Pengembangan, 20% Cadangan.</p></section>')}
function openLayer(id){const x=architectureLayers.find(v=>v.id===id);if(!x)return;page='layer-'+id;nav();const idx=architectureLayers.findIndex(v=>v.id===id);const body='<section class="card hero"><div class="eyebrow">ARCHITECTURE LAYER '+String(idx+1).padStart(2,'0')+' / '+architectureLayers.length+'</div><h2>'+esc(x.name)+'</h2><p class="muted">'+esc(x.subtitle)+'</p></section><section class="card"><h3>Isi lapisan</h3><p class="muted" style="margin-top:8px">'+esc(x.body)+'</p><div class="feed" style="margin-top:12px">'+x.items.map(t=>'<div class="feeditem">'+esc(t)+'</div>').join('')+'</div><div class="notice" style="margin-top:12px">Status arsitektur/penjelasan ini tidak dengan sendirinya membuktikan bahwa layanan, mitra, proyek, manfaat, atau operasi lintas negara telah aktif.</div><div class="actions"><button class="btn" onclick="go(\'architecture\')">← Semua lapisan</button>'+(x.prev?'<button class="btn" onclick="openLayer(\''+x.prev+'\')">← Lapisan sebelumnya</button>':'')+(x.next?'<button class="btn primary" onclick="openLayer(\''+x.next+'\')">Lapisan berikutnya →</button>':'<button class="btn primary" onclick="go(\'rooms\')">Lanjut ke Operational Rooms →</button>')+'</div></section>';document.getElementById('app').innerHTML='<section class="page">'+body+'</section>'}
function roomsPage(){frame('ROOMS','Operational Rooms','Pilih ruang untuk melihat tujuan, batas kewenangan, status, dan tindakan yang tersedia.',roomCards())}
function openRoom(id){const r=rooms.find(x=>x.id===id);if(!r)return;page='room-'+id;nav();const related={architecture:['network','security'],network:['partners','pilots'],partners:['network','pilots','projects'],pilots:['partners','projects','evidence'],projects:['development','capital','evidence'],development:['projects','capital'],capital:['distribution','reconciliation'],distribution:['capital','evidence','reconciliation'],evidence:['pilots','projects','reconciliation'],reconciliation:['distribution','evidence','system'],security:['partners','system'],system:['security','evidence'],payment:['distribution','reconciliation','system']};const relatedButtons=(related[id]||[]).map(k=>{const x=rooms.find(v=>v.id===k);return x?'<button class="btn" onclick="openRoom(\''+x.id+'\')">'+esc(x.name)+' →</button>':''}).join('');const detail='<section class="card hero"><div class="eyebrow">VCMC ROOM · '+esc(r.state)+'</div><h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.desc)+'</p></section><section class="card"><h3>Fungsi dan batas</h3><p class="muted" style="margin-top:8px">'+esc(r.purpose)+'</p><div class="notice" style="margin-top:12px">Status: '+esc(r.state)+'. Label ini adalah status implementasi yang tercatat pada frontend, bukan bukti bahwa backend atau operasi nyata telah lulus.</div><div class="sectionhead"><h3>Ruang yang terkait</h3><span class="muted small">Navigasi lintas-ruang</span></div><div class="actions">'+relatedButtons+'</div><div class="actions"><button class="btn" onclick="go(\'rooms\')">← Semua Rooms</button>'+(identity&&r.api?'<button class="btn primary" onclick="loadRoomData(\''+r.id+'\')">Muat data operasional</button>':'')+'</div><div id="roomdata" style="margin-top:14px"></div></section>';
 document.getElementById('app').innerHTML='<section class="page">'+detail+'</section>';
}
async function loadRoomData(id){const r=rooms.find(x=>x.id===id);if(!r||!r.api)return;const box=document.getElementById('roomdata');box.innerHTML='<div class="notice">Memeriksa backend...</div>';try{const d=await api(r.api);box.innerHTML='<div class="feeditem good"><b>Data diterima dari backend</b><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(d,null,2))+'</pre></div>'}catch(e){box.innerHTML='<div class="feeditem warn"><b>Belum terbukti tersambung</b><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="go(\'system\')">Periksa System / API</button></div>'}}
function evidencePage(){frame('EVIDENCE CENTER','Evidence & Verification','Alur bukti dan catatan hash. Status proof tidak boleh dinaikkan oleh frontend.',
 '<div class="grid"><div class="tile"><b>Evidence ID</b><span class="muted">Traceable record</span></div><div class="tile"><b>Hash</b><span class="muted">Integrity reference</span></div><div class="tile"><b>Source</b><span class="muted">Responsible source</span></div><div class="tile"><b>Status</b><span class="muted">Verification required</span></div></div><section class="card"><div class="feeditem"><b>CLAIM → RECORDED → EVIDENCE SUBMITTED → VERIFIED → RECONCILED → PROVEN</b><p class="muted" style="margin-top:6px">Frontend tidak membuat evidence palsu atau mengubah status proof. Data hanya ditampilkan dari backend jika koneksi dan izin berhasil.</p></div><div class="actions"><button class="btn primary" onclick="loadEvidence()">Muat daftar Evidence</button><button class="btn" onclick="go(\'system\')">Cek koneksi backend</button></div><div id="evidence-data" style="margin-top:12px"></div></section>')}
async function loadEvidence(){const el=document.getElementById('evidence-data');el.innerHTML='<div class="notice">Memeriksa backend...</div>';try{const d=await api('/api/evidence');el.innerHTML='<div class="feeditem good"><b>Evidence terambil · '+esc(d.count)+'</b><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(d.items,null,2))+'</pre></div>'}catch(e){el.innerHTML='<div class="feeditem warn">'+esc(e.message)+'</div>'}}
function systemPage(){frame('SYSTEM','System & Operations','Frontend deployment layer dan backend runtime adalah dua komponen berbeda.',
 '<div class="grid"><div class="tile"><b>Frontend</b><span class="pill teal">ACTIVE</span></div><div class="tile"><b>Backend</b><span id="api-state" class="pill warn">NOT VERIFIED</span></div><div class="tile"><b>Database</b><span class="muted">SQLite · backend boundary</span></div><div class="tile"><b>Real money</b><span class="pill">DISABLED / controlled</span></div></div>'+
 '<section class="card"><h3>Backend connection</h3><p class="muted small" style="margin:5px 0 10px">Masukkan URL server backend yang memang sudah terpasang. Jangan masukkan token atau password ke sini. Koneksi lintas-domain memerlukan CORS yang diizinkan server.</p><label class="field"><span class="muted small">Backend base URL (HTTPS)</span><input id="api-base" class="input" placeholder="https://your-existing-backend.example"></label><div class="actions"><button class="btn primary" onclick="saveApi()">Simpan URL</button><button class="btn" onclick="checkApi()">Uji /health</button><button class="btn" onclick="clearApi()">Hapus URL</button></div><div id="api-result" class="small" style="margin-top:10px"></div></section>'+
 '<section class="card"><h3>Two-part architecture</h3><div class="feed" style="margin-top:10px"><div class="feeditem"><b>Part 1 — Frontend</b><br><span class="muted">Public UI, navigation, Rooms and evidence/control presentation.</span></div><div class="feeditem"><b>Part 2 — Backend</b><br><span class="muted">Login, sessions, database, APIs, calculation, allocation, evidence, reconciliation and payment boundary. Must be independently tested.</span></div></div><div class="notice" style="margin-top:12px">API reachability ≠ authentication success ≠ permission ≠ operational proof. REAL_MONEY must remain false.</div></section>')}
async function api(path,method='GET',data=null){if(!apiBase)throw new Error('URL backend belum diatur. Buka System lalu masukkan URL backend yang benar.');const h={'Accept':'application/json'};if(data!==null)h['Content-Type']='application/json';if(token)h['Authorization']='Bearer '+token;let res;try{res=await fetch(apiBase.replace(/\/+$/,'')+path,{method,headers:h,body:data===null?undefined:JSON.stringify(data),credentials:'omit',cache:'no-store'})}catch(e){throw new Error('Koneksi browser gagal. Periksa URL HTTPS dan izin CORS pada backend. Detail: '+e.message)}let body={};try{body=await res.json()}catch(_){}if(!res.ok)throw new Error('HTTP '+res.status+' · '+(body.error||'request_failed'));return body}
function saveApi(){const v=(document.getElementById('api-base').value||'').trim().replace(/\/+$/,'');if(v&&!/^https:\/\/[^ ]+$/i.test(v)){setMessage('api-result','Gunakan URL HTTPS yang valid.');return}apiBase=v;localStorage.setItem(API_KEY,v);setMessage('api-result',v?'URL disimpan di perangkat ini. Backend belum dinyatakan teruji sampai /health berhasil.':'URL backend dikosongkan.',true)}
function clearApi(){apiBase='';localStorage.removeItem(API_KEY);const i=document.getElementById('api-base');if(i)i.value='';setMessage('api-result','URL backend dihapus.',true);const s=document.getElementById('api-state');if(s)s.textContent='NOT VERIFIED'}
async function checkApi(){const i=document.getElementById('api-base');if(i&&i.value.trim()!==apiBase)saveApi();const el=document.getElementById('api-result');el.textContent='Memeriksa /health...';try{const d=await api('/health');el.textContent='HTTP OK · '+JSON.stringify(d);el.className='goodtext small';const s=document.getElementById('api-state');if(s){s.textContent='HEALTH OK';s.className='pill teal'}}catch(e){el.textContent=e.message;el.className='badtext small';const s=document.getElementById('api-state');if(s){s.textContent='NOT CONNECTED';s.className='pill warn'}}}
function accessPage(){frame('PUBLIC GLOBAL PARTNER GATEWAY','Request / Invitation','Pintu umum terbuka. Mengajukan permintaan tidak otomatis membuat akun, memberi status partner, kewenangan, atau akses ke Case.',
 '<section class="card"><div class="sectionhead"><h3>Identifikasi calon mitra</h3><span class="muted small">Public / invited</span></div><form id="access-form" onsubmit="submitAccess(event)"><div class="formgrid"><label class="field"><span>Jenis permintaan</span><select class="input" name="request_type"><option value="open">Public / Independent</option><option value="invited">Invited / Existing Partner</option></select></label><label class="field"><span>Nama</span><input class="input" name="name" required autocomplete="name"></label><label class="field"><span>Organisasi</span><input class="input" name="organization"></label><label class="field"><span>Negara</span><input class="input" name="country" autocomplete="country-name"></label><label class="field"><span>Kontak via</span><select class="input" name="contact_type"><option value="phone">Phone / WhatsApp</option><option value="email">Email</option></select></label><label class="field"><span>Nomor telepon atau email</span><input class="input" name="contact_value" required autocomplete="email"></label><label class="field"><span>Bahasa</span><select class="input" name="language"><option value="id">Bahasa Indonesia</option><option value="en">English</option><option value="ar">العربية</option><option value="es">Español</option><option value="fr">Français</option></select></label><label class="field"><span>Kode undangan (jika ada)</span><input class="input" name="invitation_code" autocomplete="off"></label><label class="field full"><span>Kebutuhan / tujuan / kesempatan</span><textarea class="input" name="message" placeholder="Jelaskan kebutuhan, lokasi, pihak terkait atau bentuk kerja sama."></textarea></label></div><label class="checkline"><input type="checkbox" required> Saya memahami bahwa pengiriman permintaan bukan persetujuan, bukan status Partner, dan bukan pemberian otoritas atau akses Case.</label><div class="actions"><button class="btn primary" type="submit">Kirim permintaan ke backend</button><button class="btn" type="button" onclick="go(\'login\')">Saya sudah punya akun</button></div></form><div id="access-result" style="margin-top:12px"></div></section><section class="card"><h3>Alur yang benar</h3><p class="muted" style="margin-top:7px">PUBLIC → REQUEST / INVITATION → IDENTIFY → SCREEN / ASSESS → STATUS → AUTHORITY → ACCESS. Akses eksternal dibatasi pada Case yang secara eksplisit diizinkan.</p></section>')}
async function submitAccess(e){e.preventDefault();const form=e.target,fd=new FormData(form),data=Object.fromEntries(fd.entries());const invitation=(data.invitation_code||'').trim();delete data.invitation_code;data.message=(data.message||'').trim();if(invitation)data.message+=(data.message?'\\n':'')+'Invitation reference (unverified): '+invitation;const out=document.getElementById('access-result');out.innerHTML='<div class="notice">Mencoba mencatat permintaan...</div>';try{const d=await api('/api/public/access-requests','POST',data);out.innerHTML='<div class="feeditem good"><b>REQUESTED · permintaan tercatat</b><br>ID: '+esc(d.id)+'<br><span class="muted">Pemeriksaan VCMC masih diperlukan. Simpan ID ini untuk referensi.</span></div>';form.reset()}catch(err){out.innerHTML='<div class="feeditem warn"><b>Belum tercatat</b><br>'+esc(err.message)+'<p class="muted small">Jangan menganggap permintaan terkirim. Periksa System/backend atau hubungi saluran resmi yang sudah ditetapkan.</p></div>'}}
function loginPage(){frame('IDENTITY & SESSION','Login / Identify','Login hanya membuktikan autentikasi. Login tidak otomatis memberi Partner status, authority atau seluruh akses Case.',
 '<section class="card"><form id="login-form" onsubmit="submitLogin(event)"><div class="formgrid"><label class="field full"><span>Email atau login ID</span><input class="input" name="email" required autocomplete="username"></label><label class="field full"><span>Password</span><div style="display:flex;gap:7px"><input class="input" style="margin:0" id="login-password" type="password" name="password" required autocomplete="current-password"><button class="btn" type="button" onclick="togglePassword(\'login-password\',this)">Lihat</button></div></label><label class="field full"><span>Entry context</span><select class="input" name="context"><option value="PUBLIC">Public</option><option value="INDIVIDUAL">Individual</option><option value="PROFESSIONAL">Professional</option><option value="ENTREPRENEUR">Entrepreneur / Business</option><option value="ORGANIZATION">Organization</option><option value="CANDIDATE">Candidate (if approved)</option><option value="PARTNER">Partner (if approved)</option><option value="CREATOR">Creator (restricted)</option></select></label></div><div class="actions"><button class="btn primary" type="submit">Masuk</button><button class="btn" type="button" onclick="go(\'access\')">Request access</button><button class="btn" type="button" onclick="recoverPage()">Lupa password</button></div></form><div id="login-result" style="margin-top:12px"></div></section><div class="notice">Tidak ada password default yang ditampilkan. Jangan membagikan password atau token kepada siapa pun.</div>')}
async function submitLogin(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries()),out=document.getElementById('login-result');out.textContent='Memeriksa identitas...';try{const d=await api('/api/login','POST',data);if(!d.token)throw new Error('Backend tidak mengembalikan session token.');token=d.token;sessionStorage.setItem(TOKEN_KEY,token);identity={role:d.role,status:d.status,context:d.context,email:data.email};out.innerHTML='<div class="feeditem good">Login berhasil. Identity dan session diterima. Status/authority tetap mengikuti backend.</div>';setTimeout(()=>go('home'),500)}catch(err){out.innerHTML='<div class="feeditem warn">'+esc(err.message)+'</div>'}}
function togglePassword(id,btn){const el=document.getElementById(id);if(!el)return;el.type=el.type==='password'?'text':'password';btn.textContent=el.type==='password'?'Lihat':'Sembunyikan'}
function recoverPage(){frame('ACCOUNT RECOVERY','Pemulihan password','Backend harus menyediakan kanal pemulihan yang terkonfigurasi. Token reset tidak ditampilkan atau disimpan di halaman publik.',
 '<section class="card"><form onsubmit="submitRecover(event)"><label class="field"><span>Email akun</span><input class="input" name="email" type="email" required autocomplete="email"></label><button class="btn primary" type="submit">Minta pemulihan</button></form><div id="recover-result" style="margin-top:12px"></div></section>')}
async function submitRecover(e){e.preventDefault();const out=document.getElementById('recover-result');try{await api('/api/password/recover','POST',Object.fromEntries(new FormData(e.target).entries()));out.innerHTML='<div class="feeditem good">Jika akun tersedia, proses pemulihan mengikuti kanal resmi yang dikonfigurasi. Jika tidak ada kanal, administrator harus menyiapkannya.</div>'}catch(err){out.innerHTML='<div class="feeditem warn">'+esc(err.message)+'</div>'}}
function accountPage(){frame('ACCOUNT & SESSION','Pengaturan akun','Sesi disimpan untuk tab ini saja. Logout menghapus token dari sesi browser; data sensitif tidak ditampilkan kembali.',
 '<section class="card"><div class="feeditem"><b>Current session</b><br><span class="muted">'+esc(identity?identity.email||'Authenticated account':'Not authenticated')+' · '+esc(identity?identity.role:'PUBLIC')+' · '+esc(identity?identity.status||'status from backend':'No session')+'</span></div><div class="actions"><button class="btn primary" onclick="loadMe()">Refresh identity</button><button class="btn" onclick="changePasswordPage()">Change password</button><button class="btn" onclick="logout()">Logout</button></div><div id="account-result" style="margin-top:12px"></div></section>')}
async function loadMe(){const el=document.getElementById('account-result');try{const d=await api('/api/me');identity={...identity,...d};el.innerHTML='<pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(d,null,2))+'</pre>'}catch(e){el.textContent=e.message}}
function changePasswordPage(){frame('ACCOUNT SECURITY','Change password','Password change requires a valid authenticated session and current password.',
 '<section class="card"><form onsubmit="submitPasswordChange(event)"><label class="field"><span>Password sekarang</span><input class="input" name="current_password" type="password" required autocomplete="current-password"></label><label class="field"><span>Password baru (minimal 8 karakter)</span><input class="input" name="new_password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn primary" type="submit">Ubah password</button></form><div id="password-result" style="margin-top:12px"></div></section>')}
async function submitPasswordChange(e){e.preventDefault();const out=document.getElementById('password-result');try{const d=await api('/api/password/change','POST',Object.fromEntries(new FormData(e.target).entries()));out.textContent='Hasil: '+(d.status||'password_changed');out.className='goodtext small';e.target.reset()}catch(err){out.textContent=err.message;out.className='badtext small'}}
async function logout(){try{if(token)await api('/api/logout','POST',{})}catch(_){}token='';identity=null;sessionStorage.removeItem(TOKEN_KEY);go('home')}
function helpPage(){frame('SUPPORT','Bantuan & dukungan','Saluran dukungan harus ditetapkan oleh pengelola. Jangan mengirimkan password, token, atau data keuangan rahasia melalui pesan umum.',
 '<section class="card"><h3>Untuk pertanyaan atau kendala</h3><div class="feed" style="margin-top:10px"><div class="feeditem"><b>1. Jelaskan masalah</b><br><span class="muted">Sebutkan halaman, tindakan, waktu, dan pesan error yang terlihat.</span></div><div class="feeditem"><b>2. Sertakan bukti yang aman</b><br><span class="muted">Gunakan status/error umum; tutupi email pribadi, token, kode aktivasi, dan data sensitif.</span></div><div class="feeditem"><b>3. Status sistem</b><br><span class="muted">Periksa halaman System. Health OK tidak membuktikan semua API, permission, atau fitur sudah lulus.</span></div></div><div class="actions"><button class="btn primary" onclick="go(\'system\')">Periksa System</button><button class="btn" onclick="copyDiagnostics()">Salin ringkasan teknis</button></div><div id="help-result" class="small" style="margin-top:10px"></div></section>')}
async function copyDiagnostics(){const text='VCMC-VP diagnostic\\nFrontend: active\\nBackend URL configured: '+(!!apiBase)+'\\nSession present: '+(!!token)+'\\nREAL_MONEY: disabled by frontend boundary\\nPlease do not include passwords, session tokens, or private case data.';try{await navigator.clipboard.writeText(text);setMessage('help-result','Ringkasan aman disalin.',true)}catch(e){setMessage('help-result',text,true)}}
async function systemCheck(){if(!apiBase)return;try{const d=await api('/health');const s=document.getElementById('api-state');if(s){s.textContent='HEALTH OK';s.className='pill teal'}}catch(_){}}
go('home');
</script>
</body>
</html>
