name: VCMC-VP Account Password Change Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.py'
      - 'docs/index.html'
      - '.github/workflows/account-password-change-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend syntax
        run: python -m py_compile server.py
      - name: Verify password-change route and UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path("server.py").read_text()
          page = Path("docs/index.html").read_text()
          checks = {
              "authenticated password-change route": "if p=='/api/password/change':" in server and "user=self.auth()" in server,
              "current password verification": "verify_password(current_password,user.get('password_hash') or '')" in server,
              "password confirmation validation": "confirm_password=str(data.get('confirm_password',''))" in server and "password_confirmation_mismatch" in server,
              "session invalidation after password change": "DELETE FROM sessions WHERE user_id=?" in server,
              "account UI has confirmation field": 'id=\\'change-confirm\\'' in page,
              "account UI has visibility controls": "togglePassword" in page and "change-current" in page,
              "client returns to login after change": "sessionStorage.removeItem(TOKEN_KEY);setTimeout(()=>go('login'),1200)" in page,
          }
          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          if not all(checks.values()):
              raise SystemExit(1)
          PY
