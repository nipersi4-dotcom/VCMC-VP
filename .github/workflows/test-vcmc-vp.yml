name: VCMC-VP Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  roadmap-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run VCMC-VP roadmap test
        run: python test_roadmap_3_10.py

      # Automatic push-trigger marker; no application code change.
