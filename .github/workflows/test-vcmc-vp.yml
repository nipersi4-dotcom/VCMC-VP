name: VCMC-VP Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  roadmap-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run VCMC-VP roadmap test
        run: python test_roadmap_3_10.py

      - name: Run frontend contract and JavaScript syntax tests
        run: python test_frontend_contract.py

      - name: Run public registration and email verification contract tests
        run: python test_registration_flow.py

      - name: Probe deployed VCMC backend entry points
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          hosts = [
              "https://vcmc-vp.vcmc.blitz.cloud",
          ]
          for host in hosts:
              for path in ("/health", "/api/public/presence", "/api/system/readiness"):
                  url = host + path
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "VCMC-VP-live-probe/1.0"})
                      with urllib.request.urlopen(req, timeout=12) as response:
                          body = response.read(500).decode("utf-8", "replace").replace("\\n", " ")
                          print(f"LIVE_PROBE {url} STATUS={response.status} BODY={body[:220]}")
                  except urllib.error.HTTPError as error:
                      body = error.read(500).decode("utf-8", "replace").replace("\\n", " ")
                      print(f"LIVE_PROBE {url} STATUS={error.code} BODY={body[:220]}")
                  except Exception as error:
                      print(f"LIVE_PROBE {url} ERROR={type(error).__name__}: {error}")
          PY
