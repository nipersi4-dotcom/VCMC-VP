name: VCMC-VP Runtime and Contract Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/public-gateway-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test existing operational roadmap
        run: python test_roadmap_3_10.py
      - name: Test public frontend contract
        run: python test_frontend_contract.py
      - name: Test public bootstrap without admin secrets
        run: python test_public_bootstrap.py
