name: VCMC-VP Agent Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server.py"
      - "test_*.py"
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/workflows/vcmc-agent-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VCMC_REAL_MONEY_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python syntax
        run: python3 -m py_compile server.py

      - name: Seven-stage build gate
        run: python3 test_7_stages.py

      - name: Roadmap tests
        run: python3 test_roadmap_3_10.py

      - name: Agent evidence summary
        run: |
          {
            echo "# VCMC-VP Agent Gate"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Real money: ${VCMC_REAL_MONEY_ENABLED}"
            echo "- Syntax: PASS"
            echo "- Seven-stage gate: PASS"
            echo "- Roadmap 3-10 tests: PASS"
            echo
            echo "AI/automation is support only. Passing tests are evidence of executed tests, not proof of a pilot or real payment execution."
          } > agent-evidence.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: vcmc-vp-agent-evidence
          path: agent-evidence.md
          retention-days: 7
