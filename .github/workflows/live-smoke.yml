name: VCMC-VP Live Deployment Proof

on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'docs/index.html'
      - 'test_public_bootstrap.py'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcmc-vp-live-proof
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify DockHosting backend is running this exact build
        env:
          HEALTH_URL: https://vcmc-vp.dockhosting.dev/health
          READINESS_URL: https://vcmc-vp.dockhosting.dev/api/system/readiness
          EXPECTED_MARKER: vcmc-vp-live-verification-2026-10-23-a
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          health_url = os.environ["HEALTH_URL"]
          expected = os.environ["EXPECTED_MARKER"]
          last = "no response"
          health = None
          for attempt in range(1, 61):
              try:
                  req = urllib.request.Request(health_url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      health = json.loads(response.read().decode("utf-8"))
                  last = json.dumps(health, ensure_ascii=False)
                  if health.get("status") == "ok" and health.get("build_marker") == expected:
                      break
              except Exception as exc:
                  last = repr(exc)
              print(f"Attempt {attempt}/60: waiting for expected deployed build; {last}", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("FAIL: DockHosting did not expose the expected build marker within 10 minutes. Last result: " + last)
          if health.get("real_money_enabled") is not False:
              raise SystemExit("FAIL: real-money boundary is not explicitly false: " + json.dumps(health))
          print("PASS: exact backend build is live; REAL_MONEY=false.")
          print("HEALTH=" + json.dumps(health, ensure_ascii=False))
          with urllib.request.urlopen(os.environ["READINESS_URL"], timeout=15) as response:
              readiness = json.loads(response.read().decode("utf-8"))
          if readiness.get("real_money_enabled") is not False:
              raise SystemExit("FAIL: readiness endpoint does not preserve REAL_MONEY=false: " + json.dumps(readiness))
          print("READINESS=" + json.dumps(readiness, ensure_ascii=False))
          print("NOTE: readiness fields such as admin_configured/ready are reported as-is; they are not silently treated as passed.")
          PY
      - name: Verify public GitHub Pages frontend source is reachable and wired to DockHosting
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://nipersi4-dotcom.github.io/VCMC-VP/"
          req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
          with urllib.request.urlopen(req, timeout=20) as response:
              page = response.read().decode("utf-8", "replace")
              print("Frontend HTTP:", response.status)
          required = {
              "DockHosting default backend": "https://vcmc-vp.dockhosting.dev",
              "password visibility control": "function togglePassword(",
              "public access request flow": "submitAccess(event)",
              "real-money safety boundary": "REAL_MONEY",
          }
          missing = [name for name, needle in required.items() if needle not in page]
          if missing:
              raise SystemExit("FAIL: public frontend missing expected markers: " + ", ".join(missing))
          print("PASS: public frontend is reachable and includes backend target, password visibility control, public access flow, and safety boundary.")
          PY
