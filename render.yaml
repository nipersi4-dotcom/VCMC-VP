services:
  - type: web
    name: vcmc-vp
    runtime: docker
    plan: free
    healthCheckPath: /health

    envVars:
      - key: VCMC_REAL_MONEY_ENABLED
        value: "false"

      - key: VCMC_ADMIN_EMAIL
        value: "vcmcpusat@gmail.com"

      - key: VCMC_ADMIN_PASSWORD
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM_EMAIL
        sync: false

      - key: PUBLIC_BASE_URL
        value: "https://nipersi4-dotcom.github.io/VCMC-VP"
